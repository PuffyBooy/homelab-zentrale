<meta charset="utf-8">
<title>Homelab-Zentrale</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-000); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; }
  .brand { fill:var(--accent); }
  .ink { fill:var(--ink); }
  .tint { fill:var(--accent-soft); }
  .deep { fill:var(--bg-300); }
  .ok { fill:var(--ok); }
  .cut { fill:var(--bg-000); }
  .dot { fill:var(--line-strong); }
  .blk { rx:var(--radius-lg); }
  .chip { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:600; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>

  arrangement one tall amber slab on the left with a readout stack beside it, all on the space-4 grid, gutters space-4
  pattern     dot grid, from "4-px-Raster … präzise, nicht weich": 3px dots in line-strong at a space-4 pitch around the readout, the radar paper of a control room
  scales      sides in space-4 multiples; gutters space-4; pitch space-4; corners radius-lg on slabs, radius-sm on the status chip
