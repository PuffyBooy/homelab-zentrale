# Mealie with SQLite (templates/apps/README.md). Values come from .env.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      MAX_WORKERS: '1'
      WEB_CONCURRENCY: '1'
    ports:
      - '${BIND}:${WEB_PORT}:9000'
    volumes:
      - ./data/mealie:/app/data
