# Audiobookshelf (templates/apps/README.md). Values come from .env.
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.38.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - '${BIND}:${WEB_PORT}:80'
    volumes:
      - ./data/config:/config
      - ./data/metadata:/metadata
      - ./data/audiobooks:/audiobooks
      - ./data/podcasts:/podcasts
