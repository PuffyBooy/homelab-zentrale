# Navidrome (templates/apps/README.md). Values come from .env.
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      TZ: ${TZ}
    ports:
      - '${BIND}:${WEB_PORT}:4533'
    volumes:
      - ./data/navidrome:/data
      - ./data/music:/music:ro
