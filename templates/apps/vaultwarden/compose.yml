# Vaultwarden (templates/apps/README.md). Needs HTTPS in front (tailscale serve or a reverse proxy).
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TZ: ${TZ}
    ports:
      - '${BIND}:${WEB_PORT}:80'
    volumes:
      - ./data/vaultwarden:/data
