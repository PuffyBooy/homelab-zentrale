# Homelab-Zentrale agent, one per server. Installed by deploy/install-agent.sh.
#   docker compose -f deploy/docker-compose.agent.yml up -d
# Local build instead of the GHCR image:
#   docker compose -f deploy/docker-compose.agent.yml -f deploy/docker-compose.agent.build.yml up -d --build
# Config (HZ_CORE_URL, HZ_AGENT_TOKEN, HZ_AGENT_NAME, HZ_AGENT_ALLOW_TERMINAL,
# HZ_AGENT_ALLOW_RELAY) comes from
# /etc/homelab-agent/agent.env (mode 0600, outside /opt/homelab so no action can rewrite it).
#
# The agent opens no port for itself. It dials out to wss://<core>.ts.net/agent (docs/NETWORK.md).
# Only on a game ingress (HZ_AGENT_ALLOW_RELAY=1, below) it listens on the game ports the core
# sets with relay.set.
#
# Why each right is needed (everything else is dropped):
# - /var/run/docker.sock        containers: inventory, events, start/stop/restart, logs, image
#                               update; the bundled docker CLI runs `docker compose` for compose.*.
#                               NOTE: access to the Docker socket is equivalent to root on the host.
# - pid: host                   /proc shows host processes; /host/proc/1 is the host init, which
#                               nsenter and the host file view (/host/proc/1/root) need.
# - network_mode: host          host network counters, listening ports (ss), tailscale IP, and
#                               checks/pings from this server's own network; M12 wake listeners
#                               of sleeping games bind their published host ports (>= 1024 only,
#                               no data is ever forwarded). Also wol.send: Wake-on-LAN broadcasts
#                               must leave on the host LAN.
#                               M15 relay listeners on an ingress bind the public game ports
#                               (>= 1024 only).
# - /proc -> /host/proc:ro      host mount table and network counters, read-only.
# - /sys -> /host/sys:ro        hardware sensors (systeminformation also reads /sys), read-only.
# - /opt/homelab (same path)    the only directory actions may write to (compose.write, games).
#                               Same path inside and outside, so compose bind mounts match the host.
# - user 0:0 + capabilities     root inside the container, limited to these capabilities:
#     SYS_ADMIN, SYS_PTRACE, SYS_CHROOT  nsenter into host PID 1 (setns, /proc/1/ns, /proc/1/root)
#                                        for apt, journalctl, fail2ban-client, systemctl reboot
#     DAC_READ_SEARCH                    read host logs not owned by root (auth.log is syslog:adm)
#     DAC_OVERRIDE, CHOWN, FOWNER, FSETID, SETUID, SETGID
#                                        apt-get/dpkg (cleanup: purge old kernels) via nsenter, /data
#     NET_RAW                            check.ping
# - apparmor=unconfined         the docker-default AppArmor profile forbids ptrace-reading host
#                               PID 1 (needed for nsenter). Hosts without AppArmor ignore this.
# - read_only + tmpfs /tmp, no-new-privileges: the image itself stays immutable
#                               (the docker CLI keeps its config in /tmp/.docker).
#
# Services (M16, HZ_AGENT_SERVICES in agent.env, e.g. HZ_AGENT_SERVICES=nginx.service,smbd):
# the only systemd units the UI may start/stop/restart (systemctl via the same nsenter as
# reboot). Empty = list only. tailscaled, docker, containerd, ssh/sshd, dbus, systemd-*,
# networking, NetworkManager and getty are refused whatever this list says.
#
# Auto-update (M17): the agent updates the core container on this host (hz.role=core) itself.
# To replace *itself* it starts a short-lived helper container from its current image
# (label hz.role=updater, `node dist/updater.js`). The helper needs the Docker socket because
# renaming/creating/stopping/starting/removing the agent container is only possible through
# the Docker API (root-equivalent, like the agent's own socket). It gets nothing else: only
# the socket and the agent-data volume (for the result file), no network, read-only root,
# cap_drop ALL, no-new-privileges; it journals every step to /data and is restarted
# on failure (max 3) to finish or undo the swap. The image HEALTHCHECK is healthy only while
# the agent is connected to the core (/tmp/hz-connected on the tmpfs below); the helper
# rolls back unless the new agent becomes healthy within 3 min.
#
# Web console (HZ_AGENT_ALLOW_TERMINAL, default 0 = every pty.* is refused): set
# HZ_AGENT_ALLOW_TERMINAL=1 in agent.env (install-agent.sh --allow-terminal), not here, so the
# env file stays the single switch. The console is a login shell on the host started with the
# same `nsenter --target 1 ...` as the other host commands, so it needs no right beyond the
# ones above. The shell runs as root but inherits this container's capability bounding set and
# no-new-privileges (no CAP_KILL, NET_ADMIN, SYS_MODULE, SYS_BOOT ...; setuid binaries do not
# gain rights). For full root work use SSH; the agent's rights are not widened for the console.
#
# Game relay (HZ_AGENT_ALLOW_RELAY, default 0 = relay.set is refused): set it to 1 in agent.env
# (install-agent.sh --allow-relay) ONLY on the ingress, i.e. the server with a public IPv4 whose
# provider firewall opens the game port range. The agent then listens on 0.0.0.0:<game port>
# (>= 1024) and forwards TCP/UDP byte for byte to the game's server, targets only inside the
# tailnet (100.64.0.0/10, fd7a:115c:a1e0::/48). It needs no extra right (ports >= 1024,
# network_mode: host above). Never set it on the home server: friends would reach it directly.
name: homelab-agent

services:
  agent:
    # Multi-arch image from GHCR (.github/workflows/images.yml). Pin with
    # HZ_AGENT_IMAGE=ghcr.io/puffybooy/homelab-agent:sha-<short>; build locally with
    # deploy/docker-compose.agent.build.yml or install-agent.sh --build-local.
    image: ${HZ_AGENT_IMAGE:-ghcr.io/puffybooy/homelab-agent:latest}
    container_name: homelab-agent
    restart: unless-stopped
    labels:
      # Never stopped, restarted or replaced from the UI (the agent refuses).
      hz.role: agent
    env_file:
      - path: ${HZ_AGENT_ENV_FILE:-/etc/homelab-agent/agent.env}
        required: false
    environment:
      HZ_AGENT_DATA: /data
      HZ_AGENT_HOST_EXEC: nsenter
      HZ_AGENT_HOST_PROC: /host/proc
      HZ_AGENT_HOST_ROOT: /host/proc/1/root
    user: '0:0'
    pid: host
    network_mode: host
    read_only: true
    tmpfs:
      # Also holds /tmp/hz-connected, the M17 health marker (healthy = connected to the core).
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_CHROOT
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - FSETID
      - SETUID
      - SETGID
      - NET_RAW
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - type: bind
        source: /opt/homelab
        target: /opt/homelab
        bind:
          create_host_path: true
      - agent-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  agent-data:
