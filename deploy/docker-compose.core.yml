# Homelab-Zentrale core (serves the web app too).
# Start (GHCR image): docker compose -f deploy/docker-compose.core.yml up -d
# Local build:        docker compose -f deploy/docker-compose.core.yml -f deploy/docker-compose.core.build.yml up -d --build
# The core uses the host network and binds 127.0.0.1:8080 only, so
# `tailscale serve` reaches it over loopback (client IPs arrive as X-Forwarded-For
# from 127.0.0.1, which the core trusts). Expose it in the tailnet with
#   tailscale serve --bg --https=443 http://127.0.0.1:8080
# Never forward this port on the router and never use tailscale funnel (docs/NETWORK.md).
name: homelab-zentrale

services:
  core:
    # Multi-arch image from GHCR (.github/workflows/images.yml). Pin with
    # HZ_CORE_IMAGE=ghcr.io/puffybooy/homelab-core:sha-<short>.
    image: ${HZ_CORE_IMAGE:-ghcr.io/puffybooy/homelab-core:latest}
    restart: unless-stopped
    labels:
      # Never stopped, restarted or replaced from the UI (the agent refuses).
      hz.role: core
    env_file:
      - path: ../.env
        required: false
    environment:
      # Host network: loopback here is the host's loopback, never 0.0.0.0.
      HZ_HOST: 127.0.0.1
      HZ_PORT: 8080
      HZ_DATA_DIR: /data
      HZ_WEB_DIR: /app/web
    network_mode: host
    volumes:
      - hz-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hz-data:
