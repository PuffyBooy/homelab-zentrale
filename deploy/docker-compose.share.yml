# Homelab-Zentrale share gateway (optional, public) on oracle-a1.
# Start (GHCR image): docker compose -f deploy/docker-compose.share.yml up -d
# Local build:        docker compose -f deploy/docker-compose.share.yml -f deploy/docker-compose.share.build.yml up -d --build
# Host network, binds 127.0.0.1:8090 only. Caddy on the same host terminates HTTPS
# (deploy/Caddyfile.share) and is the only client; its X-Forwarded-For over loopback
# is the only one the gateway trusts. The gateway talks to the core over Tailscale
# (HZ_SHARE_CORE_URL = https://heimserver.<tailnet>.ts.net), only /api/share-gateway/*.
# The core itself stays non-public (docs/NETWORK.md).
name: homelab-share

services:
  share:
    # Multi-arch image from GHCR (.github/workflows/images.yml). Pin with
    # HZ_SHARE_IMAGE=ghcr.io/puffybooy/homelab-share:sha-<short>.
    image: ${HZ_SHARE_IMAGE:-ghcr.io/puffybooy/homelab-share:latest}
    restart: unless-stopped
    # HZ_SHARE_CORE_URL and HZ_SHARE_GATEWAY_TOKEN (0600, never in the repo).
    env_file:
      - path: /etc/homelab-share/share.env
        required: true
    environment:
      # Host network: loopback here is the host's loopback, never 0.0.0.0.
      HZ_SHARE_HOST: 127.0.0.1
      HZ_SHARE_PORT: 8090
      HZ_SHARE_UI_DIR: /app/dist/ui
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
