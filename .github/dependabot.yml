version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 LTS (AGENTS.md); odd majors have no better-sqlite3 prebuilds.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /apps/agent
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 LTS (AGENTS.md); odd majors have no better-sqlite3 prebuilds.
      - dependency-name: node
        update-types: ['version-update:semver-major']
