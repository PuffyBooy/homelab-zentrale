name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: pnpm audit --prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit --prod

  docker:
    name: docker image + health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build and start core
        run: |
          printf 'HZ_SECRET_KEY=%s\n' "$(openssl rand -base64 32)" > .env
          docker compose -f deploy/docker-compose.core.yml -f deploy/docker-compose.core.build.yml up -d --build --wait
      - name: Check /api/health
        run: |
          body="$(curl -fsS http://127.0.0.1:8080/api/health)"
          echo "$body"
          echo "$body" | jq -e '.ok == true'
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.core.yml -f deploy/docker-compose.core.build.yml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.core.yml -f deploy/docker-compose.core.build.yml down -v

  ha-smoke:
    name: home assistant smoke (core + HA demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned stable Home Assistant; bump on purpose.
      HZ_SMOKE_HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.11.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core image
        run: docker build -f deploy/Dockerfile.core -t homelab-zentrale/core:local .
      - name: Pull Home Assistant (retry)
        run: |
          for i in 1 2 3 4; do
            if docker pull -q "$HZ_SMOKE_HA_IMAGE"; then exit 0; fi
            sleep $((i * 15))
          done
          echo "pulling $HZ_SMOKE_HA_IMAGE failed"
          exit 1
      - name: Smoke test (setup, HA token via core API, toggle both ways, sensor update)
        run: pnpm exec tsx test/docker/ha-smoke.ts
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          free -m

  share-image:
    name: share gateway image (amd64 + arm64) + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/amd64 and linux/arm64 (no push)
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file deploy/Dockerfile.share
          --output type=cacheonly
          .
      - name: Build linux/amd64 for the smoke test
        run: >
          docker buildx build --load
          --platform linux/amd64
          --file deploy/Dockerfile.share
          --tag homelab-zentrale/share:ci
          .
      - name: Start (read-only, no capabilities, loopback only)
        run: |
          token="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          docker run -d --name hz-share --network host --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e HZ_SHARE_CORE_URL=http://127.0.0.1:9 -e HZ_SHARE_GATEWAY_TOKEN="$token" \
            homelab-zentrale/share:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:8090/s/$(printf 'a%.0s' $(seq 1 43))" && break
            sleep 1
          done
      - name: Check routes
        run: |
          page="http://127.0.0.1:8090/s/$(printf 'a%.0s' $(seq 1 43))"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$page")" = 200
          curl -sSI "$page" | grep -qi "^content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/health)" = 404
          # Core unreachable -> generic 502 without details.
          body="$(curl -s -H "Authorization: Share $(printf 'b%.0s' $(seq 1 43))" http://127.0.0.1:8090/s/api/status)"
          echo "$body" | jq -e '. == {"ok":false,"error":"unavailable"}'
          # Not reachable on other interfaces.
          ip="$(hostname -I | awk '{print $1}')"
          if curl -s -m 3 -o /dev/null "http://$ip:8090/"; then echo "listens beyond loopback"; exit 1; fi
      - name: Logs on failure
        if: failure()
        run: docker logs hz-share
      - name: Stop
        if: always()
        run: docker rm -f hz-share || true

  installer:
    name: installer (deploy/install.sh, real docker, stub tailscale)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: Stub tailscale (no tailnet in CI)
        run: |
          mkdir -p /tmp/hz-stub
          cat > /tmp/hz-stub/tailscale <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> /tmp/hz-stub/tailscale.log
          case "$1 ${2:-}" in
            "status --json") echo '{"BackendState": "Running", "Self": {"DNSName": "heimserver.tail0000.ts.net."}}' ;;
            "serve status") echo '{}' ;;
          esac
          exit 0
          EOF
          chmod 0755 /tmp/hz-stub/tailscale
      - name: Install (build locally, no questions)
        run: |
          sudo env "PATH=/tmp/hz-stub:$PATH" HZ_HEALTH_TIMEOUT=120 \
            ./deploy/install.sh --yes --build-local --timezone Europe/Vienna > install.log 2>&1
      - name: Check install
        run: |
          grep -q 'https://heimserver.tail0000.ts.net/setup#token=' install.log
          grep -qx -- 'serve --bg --https=443 http://127.0.0.1:8080' /tmp/hz-stub/tailscale.log
          if grep -q 'funnel' /tmp/hz-stub/tailscale.log; then echo "funnel used"; exit 1; fi
          test "$(sudo stat -c '%a' /etc/homelab-zentrale)" = 700
          test "$(sudo stat -c '%a' /etc/homelab-zentrale/core.env)" = 600
          key="$(sudo sed -n 's/^HZ_SECRET_KEY=//p' /etc/homelab-zentrale/core.env)"
          test "$(printf '%s' "$key" | base64 -d | wc -c)" = 32
          if grep -qF -- "$key" install.log; then echo "key in output"; exit 1; fi
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.ok == true'
          ip="$(hostname -I | awk '{print $1}')"
          if curl -s -m 3 -o /dev/null "http://$ip:8080/"; then echo "core listens beyond loopback"; exit 1; fi
          echo "$key" | sha256sum > key.sha
      - name: Update keeps the key
        run: |
          sudo env "PATH=/tmp/hz-stub:$PATH" HZ_HEALTH_TIMEOUT=120 \
            ./deploy/install.sh update --yes > update.log 2>&1
          sudo sed -n 's/^HZ_SECRET_KEY=//p' /etc/homelab-zentrale/core.env | sha256sum | diff - key.sha
          grep -q 'homelab-zentrale/core:local' update.log
      - name: Uninstall keeps data, purge removes it
        run: |
          sudo env "PATH=/tmp/hz-stub:$PATH" ./deploy/install.sh uninstall --yes
          docker volume inspect homelab-zentrale_hz-data > /dev/null
          sudo test -f /etc/homelab-zentrale/core.env
          # Reinstall from the kept key and data, then purge a running install (compose down -v).
          sudo env "PATH=/tmp/hz-stub:$PATH" HZ_HEALTH_TIMEOUT=120 ./deploy/install.sh --yes --image homelab-zentrale/core:local > reinstall.log 2>&1
          sudo sed -n 's/^HZ_SECRET_KEY=//p' /etc/homelab-zentrale/core.env | sha256sum | diff - key.sha
          sudo env "PATH=/tmp/hz-stub:$PATH" ./deploy/install.sh uninstall --purge --yes < /dev/null
          if docker volume inspect homelab-zentrale_hz-data > /dev/null 2>&1; then echo "volume left"; exit 1; fi
          sudo test ! -e /etc/homelab-zentrale
      - name: Logs on failure
        if: failure()
        run: |
          cat install.log update.log reinstall.log 2>/dev/null | sed 's/setup#token=[A-Za-z0-9_-]*/setup#token=[redacted]/' || true
          docker ps -a

  images:
    name: publish images
    # Only a green push to main becomes :latest (never a pull request or another branch).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, audit, docker, ha-smoke, share-image, installer]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
