name: Agent

# Multi-arch agent image (linux/amd64 + linux/arm64 for Oracle and the Pi, built
# with QEMU, not pushed) and a Docker smoke test: core + agent containers,
# enrollment, live connection, containers (list, live logs, stop -> alert, image
# update), a real Paper game server (setup, players/TPS, compose config, RCON with
# step-up, backup, stop, delete), agent stopped -> server crit + open alert.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  multiarch:
    name: agent image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/amd64 and linux/arm64 (no push)
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file apps/agent/Dockerfile
          --output type=cacheonly
          .

  smoke:
    name: docker smoke (core + agent + game)
    runs-on: ubuntu-latest
    # Image builds ~10 min, Paper download + world generation up to 9 min, rest ~5 min.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build images
        run: |
          docker build -f deploy/Dockerfile.core -t homelab-zentrale/core:local .
          docker build -f apps/agent/Dockerfile -t homelab-zentrale/agent:local .
      - name: Pull smoke images (retry, Docker Hub may rate-limit)
        run: |
          # The game image comes from the template, so the smoke always uses the pinned tag.
          game_image="$(node -p "require('./templates/games/minecraft-java/template.json').image")"
          for img in busybox:1.36 busybox:1.37 "$game_image"; do
            ok=0
            for i in 1 2 3 4; do
              if docker pull -q "$img"; then ok=1; break; fi
              sleep $((i * 15))
            done
            [ "$ok" = 1 ] || { echo "pulling $img failed"; exit 1; }
          done
      - name: Smoke test
        run: pnpm exec tsx test/docker/agent-smoke.ts
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker stats --no-stream || true
          free -m
          df -h /
      - name: Trivy image scan (agent)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/apps/agent/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /.trivyignore homelab-zentrale/agent:local
